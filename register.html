<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация · Dev Monkey</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <a href="index.html">Dev Monkey</a>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Форум</a></li>
                    <li><a href="index.html?tab=repos">Репозитории</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <a href="login.html" class="btn btn-outline">Вход</a>
                <a href="register.html" class="btn btn-primary">Регистрация</a>
            </div>
        </div>
    </header>

    <main class="main-content container auth-page">
        <div class="auth-box">
            <h2>Регистрация</h2>
            <form class="auth-form">
                <div class="form-group">
                    <label for="fullname">Имя пользователя</label>
                    <input type="text" id="fullname" placeholder="alice_dev">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="alice@example.com">
                </div>
                <div class="form-group">
                    <label for="reg-password">Пароль</label>
                    <input type="password" id="reg-password" placeholder="минимум 8 символов">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Подтверждение пароля</label>
                    <input type="password" id="confirm-password" placeholder="········">
                </div>
                <div class="form-check">
                    <input type="checkbox" id="terms">
                    <label for="terms">Я принимаю <a href="#">условия использования</a></label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
                <div class="auth-links">
                    Уже есть аккаунт? <a href="login.html">Войти</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Dev Monkey. Сообщество разработчиков.</p>
        </div>
    </footer>
</body>
</html>
