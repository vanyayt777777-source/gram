<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Account Market</title>
    <style>
        /* ТЕМНАЯ ТЕМА И ОСНОВНЫЕ СТИЛИ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* НЕОНОВЫЕ АКЦЕНТЫ */
        .neon-green {
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .neon-red {
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }

        /* НАВИГАЦИЯ */
        .navbar {
            background: #1a1a1a;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: #00ff88;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .nav-btn.primary {
            background: #00ff88;
            color: #0a0a0a;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* КАРТОЧКИ ТОВАРОВ */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .product-card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #333;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #00ff88;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
        }

        .product-price small {
            font-size: 0.875rem;
            color: #888;
        }

        .product-seller {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
            padding: 0.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        .seller-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a0a0a;
            font-weight: bold;
        }

        .seller-rating {
            color: #ffd700;
            margin-left: auto;
        }

        .product-description {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 1rem 0;
        }

        .buy-btn {
            width: 100%;
            padding: 1rem;
            background: #00ff88;
            border: none;
            border-radius: 8px;
            color: #0a0a0a;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .buy-btn:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .buy-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #00ff88;
            box-shadow: 0 0 50px rgba(0, 255, 136, 0.3);
            animation: modalAppear 0.3s;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ФОРМЫ */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #00ff88;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        /* СТАТУС ОПЛАТЫ */
        .payment-status {
            text-align: center;
            padding: 2rem;
        }

        .payment-timer {
            font-size: 3rem;
            font-weight: bold;
            color: #00ff88;
            margin: 1rem 0;
        }

        .payment-url {
            background: #0a0a0a;
            padding: 1rem;
            border-radius: 8px;
            word-break: break-all;
            margin: 1rem 0;
        }

        .payment-url a {
            color: #00ff88;
            text-decoration: none;
        }

        .payment-url a:hover {
            text-decoration: underline;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #333;
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ЧАТ */
        .chat-messages {
            max-height: 400px;
            overflow-y: auto;
            padding: 1rem;
            background: #0a0a0a;
            border-radius: 16px;
            margin: 1rem 0;
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.75rem;
            border-radius: 12px;
            max-width: 80%;
        }

        .message.sent {
            background: #00ff88;
            color: #0a0a0a;
            margin-left: auto;
        }

        .message.received {
            background: #333;
            color: #fff;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.25rem;
        }

        /* ЗВЕЗДНЫЙ РЕЙТИНГ */
        .rating {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin: 1rem 0;
        }

        .star {
            font-size: 2rem;
            cursor: pointer;
            color: #444;
            transition: all 0.3s;
        }

        .star.active,
        .star:hover {
            color: #ffd700;
            transform: scale(1.2);
        }

        /* УВЕДОМЛЕНИЯ */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 2rem;
            background: #1a1a1a;
            border-left: 4px solid #00ff88;
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            z-index: 2000;
            animation: slideIn 0.3s;
        }

        .toast.error {
            border-left-color: #ff3366;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ПРОФИЛЬ */
        .profile-info {
            text-align: center;
            margin-bottom: 2rem;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 3rem;
            color: #0a0a0a;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin: 2rem 0;
            padding: 1rem;
            background: #0a0a0a;
            border-radius: 16px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }

        .stat-label {
            color: #888;
            font-size: 0.875rem;
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                width: 95%;
                padding: 1rem;
            }
        }

        /* ТАБЫ */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            color: #888;
            transition: all 0.3s;
        }

        .tab.active {
            color: #00ff88;
            border-bottom: 2px solid #00ff88;
        }
    </style>
</head>
<body>
    <!-- НАВИГАЦИЯ -->
    <nav class="navbar">
        <div class="logo" onclick="showMainPage()">TG Market</div>
        <div class="nav-buttons">
            <button class="nav-btn" id="sellBtn" style="display: none;" onclick="showSellForm()">Продать</button>
            <button class="nav-btn" id="profileBtn" style="display: none;" onclick="showProfile()">Профиль</button>
            <button class="nav-btn" id="loginBtn" onclick="showLoginModal()">Войти</button>
            <button class="nav-btn primary" id="registerBtn" onclick="showRegisterModal()">Регистрация</button>
            <button class="nav-btn" id="logoutBtn" style="display: none;" onclick="logout()">Выйти</button>
        </div>
    </nav>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="container" id="mainContainer">
        <div class="tabs" id="mainTabs">
            <div class="tab active" onclick="switchTab('products')">Товары</div>
            <div class="tab" onclick="switchTab('chats')">Мои чаты</div>
        </div>
        <div id="productsContainer">
            <h1>Доступные аккаунты</h1>
            <div class="products-grid" id="productsGrid"></div>
        </div>
        <div id="chatsContainer" style="display: none;">
            <h1>Мои чаты</h1>
            <div class="products-grid" id="chatsGrid"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВХОДА -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2 class="neon-green">Вход</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" value="user@test.com" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPassword" value="123" required>
                </div>
                <button type="submit" class="buy-btn">Войти</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО РЕГИСТРАЦИИ -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <h2 class="neon-green">Регистрация</h2>
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="registerName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <button type="submit" class="buy-btn">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ТОВАРА -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div id="productModalContent"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОПЛАТЫ -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <div id="paymentContent"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЧАТА -->
    <div class="modal" id="chatModal">
        <div class="modal-content">
            <div id="chatContent"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <div id="profileContent"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОТЗЫВА -->
    <div class="modal" id="reviewModal">
        <div class="modal-content">
            <div id="reviewContent"></div>
        </div>
    </div>

    <script>
        // ==================== ХРАНЕНИЕ ДАННЫХ ====================
        const Storage = {
            // Инициализация тестовых данных
            init: function() {
                if (!localStorage.getItem('users')) {
                    const users = [
                        {
                            id: '1',
                            name: 'Тестовый Продавец',
                            email: 'seller@test.com',
                            password: '123',
                            avatar: 'SP',
                            rating: 4.5,
                            reviews: []
                        },
                        {
                            id: '2',
                            name: 'Тестовый Покупатель',
                            email: 'user@test.com',
                            password: '123',
                            avatar: 'TP',
                            rating: 0,
                            reviews: []
                        }
                    ];
                    localStorage.setItem('users', JSON.stringify(users));
                }

                if (!localStorage.getItem('products')) {
                    const products = [
                        {
                            id: '1',
                            sellerId: '1',
                            sellerName: 'Тестовый Продавец',
                            title: 'Премиум аккаунт Telegram',
                            description: 'Аккаунт 2014 года, с премиум подпиской до 2025 года. Полностью верифицирован, нет ограничений.',
                            price: 4500,
                            priceUSDT: 50,
                            active: true,
                            createdAt: new Date().toISOString()
                        },
                        {
                            id: '2',
                            sellerId: '1',
                            sellerName: 'Тестовый Продавец',
                            title: 'Аккаунт для бизнеса',
                            description: 'Аккаунт 2020 года, много контактов, участие в группах. Подойдет для рассылок.',
                            price: 2700,
                            priceUSDT: 30,
                            active: true,
                            createdAt: new Date().toISOString()
                        },
                        {
                            id: '3',
                            sellerId: '1',
                            sellerName: 'Тестовый Продавец',
                            title: 'Старый аккаунт 2013',
                            description: 'Очень старый аккаунт, подходит для создания каналов и групп. Без премиум.',
                            price: 1800,
                            priceUSDT: 20,
                            active: true,
                            createdAt: new Date().toISOString()
                        }
                    ];
                    localStorage.setItem('products', JSON.stringify(products));
                }

                if (!localStorage.getItem('chats')) {
                    localStorage.setItem('chats', JSON.stringify([]));
                }

                if (!localStorage.getItem('orders')) {
                    localStorage.setItem('orders', JSON.stringify([]));
                }
            },

            // Пользователи
            getUsers: function() {
                return JSON.parse(localStorage.getItem('users')) || [];
            },

            getUser: function(email, password) {
                const users = this.getUsers();
                return users.find(u => u.email === email && u.password === password);
            },

            getUserById: function(id) {
                const users = this.getUsers();
                return users.find(u => u.id === id);
            },

            addUser: function(user) {
                const users = this.getUsers();
                user.id = Date.now().toString();
                user.avatar = user.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                user.rating = 0;
                user.reviews = [];
                users.push(user);
                localStorage.setItem('users', JSON.stringify(users));
                return user;
            },

            updateUserRating: function(userId, newRating) {
                const users = this.getUsers();
                const user = users.find(u => u.id === userId);
                if (user) {
                    if (!user.reviews) user.reviews = [];
                    user.reviews.push(newRating);
                    const sum = user.reviews.reduce((a, b) => a + b, 0);
                    user.rating = sum / user.reviews.length;
                    localStorage.setItem('users', JSON.stringify(users));
                }
            },

            // Товары
            getProducts: function() {
                return JSON.parse(localStorage.getItem('products')) || [];
            },

            getProduct: function(id) {
                const products = this.getProducts();
                return products.find(p => p.id === id);
            },

            addProduct: function(product) {
                const products = this.getProducts();
                product.id = Date.now().toString();
                product.active = true;
                product.createdAt = new Date().toISOString();
                products.push(product);
                localStorage.setItem('products', JSON.stringify(products));
                return product;
            },

            deactivateProduct: function(productId) {
                const products = this.getProducts();
                const product = products.find(p => p.id === productId);
                if (product) {
                    product.active = false;
                    localStorage.setItem('products', JSON.stringify(products));
                }
            },

            // Чаты
            getChats: function() {
                return JSON.parse(localStorage.getItem('chats')) || [];
            },

            getChat: function(productId, buyerId, sellerId) {
                const chats = this.getChats();
                return chats.find(c => c.productId === productId && c.buyerId === buyerId && c.sellerId === sellerId);
            },

            createChat: function(productId, buyerId, sellerId) {
                const chats = this.getChats();
                const existingChat = this.getChat(productId, buyerId, sellerId);
                if (existingChat) return existingChat;

                const chat = {
                    id: Date.now().toString(),
                    productId,
                    buyerId,
                    sellerId,
                    messages: [
                        {
                            id: Date.now(),
                            senderId: 'system',
                            text: 'Чат создан после успешной оплаты. Продавец может отправить данные аккаунта.',
                            timestamp: new Date().toISOString()
                        }
                    ],
                    status: 'active',
                    confirmed: false,
                    createdAt: new Date().toISOString()
                };
                chats.push(chat);
                localStorage.setItem('chats', JSON.stringify(chats));
                return chat;
            },

            addMessage: function(chatId, senderId, text) {
                const chats = this.getChats();
                const chat = chats.find(c => c.id === chatId);
                if (chat) {
                    if (!chat.messages) chat.messages = [];
                    chat.messages.push({
                        id: Date.now(),
                        senderId,
                        text,
                        timestamp: new Date().toISOString()
                    });
                    localStorage.setItem('chats', JSON.stringify(chats));
                }
                return chat;
            },

            confirmDelivery: function(chatId) {
                const chats = this.getChats();
                const chat = chats.find(c => c.id === chatId);
                if (chat) {
                    chat.confirmed = true;
                    chat.status = 'completed';
                    localStorage.setItem('chats', JSON.stringify(chats));
                }
                return chat;
            },

            // Заказы
            getOrders: function() {
                return JSON.parse(localStorage.getItem('orders')) || [];
            },

            createOrder: function(productId, buyerId, invoiceId) {
                const orders = this.getOrders();
                const order = {
                    id: Date.now().toString(),
                    productId,
                    buyerId,
                    invoiceId,
                    status: 'pending',
                    createdAt: new Date().toISOString()
                };
                orders.push(order);
                localStorage.setItem('orders', JSON.stringify(orders));
                return order;
            },

            updateOrderStatus: function(invoiceId, status) {
                const orders = this.getOrders();
                const order = orders.find(o => o.invoiceId === invoiceId);
                if (order) {
                    order.status = status;
                    if (status === 'paid') {
                        order.paidAt = new Date().toISOString();
                    }
                    localStorage.setItem('orders', JSON.stringify(orders));
                }
                return order;
            }
        };

        // ==================== API CRYPTO BOT ====================
        const CryptoAPI = {
            token: '452163:AAGTBJKe7YvufexfRN78tFhnTdGywQyUMSX',
            baseUrl: 'https://pay.crypt.bot/api',

            async createInvoice(amount, description) {
                try {
                    const response = await fetch(`${this.baseUrl}/createInvoice`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Crypto-Pay-API-Token': this.token
                        },
                        body: JSON.stringify({
                            asset: 'USDT',
                            amount: amount.toFixed(2),
                            description: description,
                            expires_in: 300 // 5 минут
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    if (!data.ok) {
                        throw new Error(data.error || 'Failed to create invoice');
                    }

                    return data.result;
                } catch (error) {
                    console.error('Error creating invoice:', error);
                    throw error;
                }
            },

            async checkPayment(invoiceId) {
                try {
                    const response = await fetch(`${this.baseUrl}/getInvoices`, {
                        method: 'GET',
                        headers: {
                            'Crypto-Pay-API-Token': this.token
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    if (!data.ok) {
                        throw new Error(data.error || 'Failed to get invoices');
                    }

                    const invoice = data.result.items.find(i => i.invoice_id === invoiceId);
                    return invoice ? invoice.status : null;
                } catch (error) {
                    console.error('Error checking payment:', error);
                    throw error;
                }
            },

            async refund(invoiceId) {
                try {
                    const response = await fetch(`${this.baseUrl}/refund`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Crypto-Pay-API-Token': this.token
                        },
                        body: JSON.stringify({
                            invoice_id: invoiceId
                        })
                    });

                    const data = await response.json();
                    return data.ok;
                } catch (error) {
                    console.error('Error refund:', error);
                    return false;
                }
            }
        };

        // ==================== ОСНОВНАЯ ЛОГИКА ====================
        let currentUser = null;
        let paymentInterval = null;
        let currentInvoice = null;

        // Инициализация
        Storage.init();
        loadProducts();

        // Показать уведомление
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Загрузка товаров
        function loadProducts() {
            const products = Storage.getProducts().filter(p => p.active);
            const grid = document.getElementById('productsGrid');
            
            grid.innerHTML = products.map(product => {
                const seller = Storage.getUserById(product.sellerId);
                const rating = seller ? seller.rating || 0 : 0;
                const stars = '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating));
                
                return `
                    <div class="product-card" onclick="showProduct('${product.id}')">
                        <div class="product-header">
                            <span class="product-title">${product.title}</span>
                        </div>
                        <div class="product-price">
                            ${product.price} ₽ <small>≈ ${product.priceUSDT} USDT</small>
                        </div>
                        <div class="product-seller">
                            <div class="seller-avatar">${seller ? seller.avatar : '??'}</div>
                            <span>${product.sellerName}</span>
                            <span class="seller-rating">${stars} (${rating.toFixed(1)})</span>
                        </div>
                        <div class="product-description">
                            ${product.description.substring(0, 100)}...
                        </div>
                        ${currentUser && currentUser.id === product.sellerId ? 
                            '<button class="buy-btn" disabled>Ваш товар</button>' : 
                            '<button class="buy-btn" onclick="event.stopPropagation(); buyProduct(\'' + product.id + '\')">Купить</button>'
                        }
                    </div>
                `;
            }).join('');
        }

        // Загрузка чатов
        function loadChats() {
            if (!currentUser) return;
            
            const chats = Storage.getChats();
            const userChats = chats.filter(c => c.buyerId === currentUser.id || c.sellerId === currentUser.id);
            const grid = document.getElementById('chatsGrid');
            
            if (userChats.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 2rem; color: #888;">У вас пока нет чатов</div>';
                return;
            }

            grid.innerHTML = userChats.map(chat => {
                const product = Storage.getProduct(chat.productId);
                const otherUser = Storage.getUserById(chat.buyerId === currentUser.id ? chat.sellerId : chat.buyerId);
                const lastMessage = chat.messages && chat.messages.length > 0 ? chat.messages[chat.messages.length - 1] : null;
                
                return `
                    <div class="product-card" onclick="openChat('${chat.id}')">
                        <div class="product-header">
                            <span class="product-title">${product ? product.title : 'Товар удален'}</span>
                            <span class="${chat.confirmed ? 'neon-green' : ''}">${chat.confirmed ? '✓ Получено' : ''}</span>
                        </div>
                        <div class="product-seller">
                            <div class="seller-avatar">${otherUser ? otherUser.avatar : '??'}</div>
                            <span>${otherUser ? otherUser.name : 'Пользователь'}</span>
                        </div>
                        <div class="product-description">
                            ${lastMessage ? lastMessage.text.substring(0, 50) + '...' : 'Нет сообщений'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Показать товар
        function showProduct(productId) {
            const product = Storage.getProduct(productId);
            const seller = Storage.getUserById(product.sellerId);
            const rating = seller ? seller.rating || 0 : 0;
            const stars = '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating));
            
            const content = document.getElementById('productModalContent');
            content.innerHTML = `
                <h2 class="neon-green">${product.title}</h2>
                <div style="margin: 1rem 0;">
                    <div class="product-price">${product.price} ₽ <small>≈ ${product.priceUSDT} USDT</small></div>
                    <div class="product-seller" style="margin-top: 1rem;">
                        <div class="seller-avatar">${seller ? seller.avatar : '??'}</div>
                        <span>Продавец: ${product.sellerName}</span>
                        <span class="seller-rating">${stars} (${rating.toFixed(1)})</span>
                    </div>
                    <p style="margin: 1rem 0; line-height: 1.6;">${product.description}</p>
                </div>
                ${currentUser && currentUser.id === product.sellerId ? 
                    '<button class="buy-btn" disabled>Это ваш товар</button>' : 
                    '<button class="buy-btn" onclick="buyProduct(\'' + product.id + '\')">Купить</button>'
                }
                <button class="buy-btn" style="margin-top: 1rem; background: transparent; border: 1px solid #333;" onclick="closeModal('productModal')">Закрыть</button>
            `;
            
            document.getElementById('productModal').classList.add('active');
        }

        // Купить товар
        async function buyProduct(productId) {
            if (!currentUser) {
                showToast('Сначала войдите в систему', 'error');
                showLoginModal();
                return;
            }

            const product = Storage.getProduct(productId);
            if (!product) {
                showToast('Товар не найден', 'error');
                return;
            }

            try {
                showToast('Создание счета...');
                
                // Создаем счет
                const invoice = await CryptoAPI.createInvoice(
                    product.priceUSDT,
                    `Покупка: ${product.title}`
                );

                // Сохраняем заказ
                Storage.createOrder(productId, currentUser.id, invoice.invoice_id);
                
                // Показываем окно оплаты
                showPaymentModal(invoice, product);
                
            } catch (error) {
                console.error('Payment error:', error);
                showToast('Ошибка создания счета: ' + error.message, 'error');
            }
        }

        // Показать окно оплаты
        function showPaymentModal(invoice, product) {
            currentInvoice = invoice;
            const expiresIn = invoice.expiration_date ? new Date(invoice.expiration_date).getTime() - Date.now() : 300000;
            const expiryTime = Date.now() + expiresIn;
            
            const content = document.getElementById('paymentContent');
            content.innerHTML = `
                <h2 class="neon-green">Оплата</h2>
                <div class="payment-status">
                    <div class="spinner"></div>
                    <p>Ожидание оплаты...</p>
                    <div class="payment-timer" id="paymentTimer">05:00</div>
                    <div class="payment-url">
                        <a href="${invoice.pay_url}" target="_blank">🔗 Открыть в Telegram</a>
                    </div>
                    <p style="color: #888; font-size: 0.9rem; margin-top: 1rem;">
                        Сумма: ${product.price} ₽ (${product.priceUSDT} USDT)<br>
                        Счет действителен 5 минут
                    </p>
                </div>
            `;
            
            document.getElementById('paymentModal').classList.add('active');
            
            // Запускаем таймер
            startPaymentTimer(expiryTime);
            
            // Начинаем проверку статуса
            startPaymentCheck(invoice.invoice_id, product);
        }

        // Таймер оплаты
        function startPaymentTimer(expiryTime) {
            const timerElement = document.getElementById('paymentTimer');
            if (!timerElement) return;

            const interval = setInterval(() => {
                const now = Date.now();
                const diff = expiryTime - now;
                
                if (diff <= 0) {
                    clearInterval(interval);
                    timerElement.textContent = '00:00';
                    timerElement.style.color = '#ff3366';
                    return;
                }
                
                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // Проверка статуса платежа
        function startPaymentCheck(invoiceId, product) {
            if (paymentInterval) {
                clearInterval(paymentInterval);
            }

            paymentInterval = setInterval(async () => {
                try {
                    const status = await CryptoAPI.checkPayment(invoiceId);
                    
                    if (status === 'paid') {
                        clearInterval(paymentInterval);
                        paymentInterval = null;
                        
                        // Обновляем статус заказа
                        Storage.updateOrderStatus(invoiceId, 'paid');
                        
                        // Деактивируем товар
                        Storage.deactivateProduct(product.id);
                        
                        // Создаем чат
                        const chat = Storage.createChat(product.id, currentUser.id, product.sellerId);
                        
                        // Показываем успех
                        showToast('Оплата подтверждена! Чат создан');
                        
                        // Закрываем окно оплаты
                        closeModal('paymentModal');
                        
                        // Открываем чат
                        openChat(chat.id);
                        
                        // Обновляем список товаров
                        loadProducts();
                        
                    } else if (status === 'expired') {
                        clearInterval(paymentInterval);
                        paymentInterval = null;
                        
                        Storage.updateOrderStatus(invoiceId, 'expired');
                        showToast('Счет просрочен', 'error');
                        closeModal('paymentModal');
                    }
                } catch (error) {
                    console.error('Error checking payment:', error);
                }
            }, 5000);
        }

        // Открыть чат
        function openChat(chatId) {
            const chat = Storage.getChats().find(c => c.id === chatId);
            if (!chat) return;

            const product = Storage.getProduct(chat.productId);
            const otherUser = Storage.getUserById(chat.buyerId === currentUser.id ? chat.sellerId : chat.buyerId);
            
            const content = document.getElementById('chatContent');
            content.innerHTML = `
                <h2 class="neon-green">Чат с ${otherUser ? otherUser.name : 'пользователем'}</h2>
                <div style="margin: 1rem 0;">
                    <p><small>Товар: ${product ? product.title : 'Удален'}</small></p>
                </div>
                <div class="chat-messages" id="chatMessages">
                    ${chat.messages ? chat.messages.map(msg => `
                        <div class="message ${msg.senderId === 'system' ? '' : (msg.senderId === currentUser.id ? 'sent' : 'received')}">
                            ${msg.text}
                            <div class="message-time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                        </div>
                    `).join('') : ''}
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <input type="text" id="chatMessageInput" class="form-group" style="flex: 1;" placeholder="Введите сообщение...">
                    <button class="buy-btn" style="width: auto;" onclick="sendMessage('${chat.id}')">Отправить</button>
                </div>
                ${chat.buyerId === currentUser.id && !chat.confirmed ? `
                    <button class="buy-btn" style="margin-top: 1rem; background: #00ff88;" onclick="showReviewForm('${chat.id}', '${product.sellerId}')">
                        Подтвердить получение
                    </button>
                ` : ''}
                ${chat.sellerId === currentUser.id && chat.confirmed ? `
                    <button class="buy-btn" style="margin-top: 1rem; background: #ff3366;" onclick="refundOrder('${chat.id}')">
                        Вернуть средства
                    </button>
                ` : ''}
                <button class="buy-btn" style="margin-top: 1rem; background: transparent; border: 1px solid #333;" onclick="closeModal('chatModal')">
                    Закрыть
                </button>
            `;
            
            document.getElementById('chatModal').classList.add('active');
            
            // Прокрутка вниз
            setTimeout(() => {
                const messagesDiv = document.getElementById('chatMessages');
                if (messagesDiv) {
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
            }, 100);
        }

        // Отправить сообщение
        function sendMessage(chatId) {
            const input = document.getElementById('chatMessageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            Storage.addMessage(chatId, currentUser.id, text);
            input.value = '';
            openChat(chatId);
        }

        // Показать форму отзыва
        function showReviewForm(chatId, sellerId) {
            const content = document.getElementById('reviewContent');
            content.innerHTML = `
                <h2 class="neon-green">Оцените продавца</h2>
                <div class="rating" id="starRating">
                    ${[1,2,3,4,5].map(i => `<span class="star" onclick="setRating(${i})">★</span>`).join('')}
                </div>
                <div class="form-group">
                    <textarea id="reviewText" placeholder="Ваш отзыв..." rows="4"></textarea>
                </div>
                <button class="buy-btn" onclick="submitReview('${chatId}', '${sellerId}')">Отправить отзыв</button>
                <button class="buy-btn" style="margin-top: 1rem; background: transparent; border: 1px solid #333;" onclick="closeModal('reviewModal')">
                    Отмена
                </button>
            `;
            
            document.getElementById('reviewModal').classList.add('active');
        }

        let currentRating = 0;

        function setRating(rating) {
            currentRating = rating;
            document.querySelectorAll('.star').forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function submitReview(chatId, sellerId) {
            if (currentRating === 0) {
                showToast('Поставьте оценку', 'error');
                return;
            }

            // Подтверждаем получение
            Storage.confirmDelivery(chatId);
            
            // Обновляем рейтинг продавца
            Storage.updateUserRating(sellerId, currentRating);
            
            showToast('Спасибо за отзыв!');
            closeModal('reviewModal');
            openChat(chatId);
        }

        // Возврат средств
        async function refundOrder(chatId) {
            const chat = Storage.getChats().find(c => c.id === chatId);
            const orders = Storage.getOrders();
            const order = orders.find(o => o.productId === chat.productId && o.buyerId === chat.buyerId);
            
            if (!order || !order.invoiceId) {
                showToast('Информация о платеже не найдена', 'error');
                return;
            }

            try {
                const success = await CryptoAPI.refund(order.invoiceId);
                if (success) {
                    showToast('Возврат инициирован');
                    chat.status = 'refunded';
                    localStorage.setItem('chats', JSON.stringify(Storage.getChats()));
                } else {
                    showToast('Ошибка возврата', 'error');
                }
            } catch (error) {
                showToast('Ошибка возврата', 'error');
            }
        }

        // Показать форму продажи
        function showSellForm() {
            const content = document.getElementById('productModalContent');
            content.innerHTML = `
                <h2 class="neon-green">Выставить товар</h2>
                <form id="sellForm" onsubmit="createProduct(event)">
                    <div class="form-group">
                        <label>Название</label>
                        <input type="text" id="productTitle" required>
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="productDescription" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Цена (₽)</label>
                        <input type="number" id="productPrice" min="1" required oninput="updateUSDT(this.value)">
                        <small style="color: #888;">≈ <span id="usdtPrice">0</span> USDT (1 USDT = 90 ₽)</small>
                    </div>
                    <button type="submit" class="buy-btn">Опубликовать</button>
                    <button type="button" class="buy-btn" style="margin-top: 1rem; background: transparent; border: 1px solid #333;" onclick="closeModal('productModal')">
                        Отмена
                    </button>
                </form>
            `;
            
            document.getElementById('productModal').classList.add('active');
        }

        function updateUSDT(rubPrice) {
            const usdt = (rubPrice / 90).toFixed(2);
            document.getElementById('usdtPrice').textContent = usdt;
        }

        function createProduct(event) {
            event.preventDefault();
            
            const title = document.getElementById('productTitle').value;
            const description = document.getElementById('productDescription').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const priceUSDT = (price / 90).toFixed(2);

            const product = {
                sellerId: currentUser.id,
                sellerName: currentUser.name,
                title,
                description,
                price,
                priceUSDT: parseFloat(priceUSDT)
            };

            Storage.addProduct(product);
            showToast('Товар опубликован');
            closeModal('productModal');
            loadProducts();
        }

        // Показать профиль
        function showProfile() {
            if (!currentUser) return;

            const userProducts = Storage.getProducts().filter(p => p.sellerId === currentUser.id);
            const stars = '★'.repeat(Math.round(currentUser.rating || 0)) + '☆'.repeat(5 - Math.round(currentUser.rating || 0));
            
            const content = document.getElementById('profileContent');
            content.innerHTML = `
                <div class="profile-info">
                    <div class="profile-avatar">${currentUser.avatar}</div>
                    <h2>${currentUser.name}</h2>
                    <p>${currentUser.email}</p>
                </div>
                <div class="profile-stats">
                    <div class="stat">
                        <div class="stat-value">${userProducts.length}</div>
                        <div class="stat-label">Товаров</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${(currentUser.rating || 0).toFixed(1)}</div>
                        <div class="stat-label">Рейтинг</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${stars}</div>
                        <div class="stat-label">Оценка</div>
                    </div>
                </div>
                <h3 style="margin: 1rem 0;">Мои товары</h3>
                <div style="max-height: 300px; overflow-y: auto;">
                    ${userProducts.map(p => `
                        <div style="background: #0a0a0a; padding: 1rem; border-radius: 8px; margin-bottom: 1rem;">
                            <div style="display: flex; justify-content: space-between;">
                                <span class="neon-green">${p.title}</span>
                                <span>${p.price} ₽</span>
                            </div>
                            <small style="color: #888;">${p.description.substring(0, 50)}...</small>
                        </div>
                    `).join('')}
                </div>
                <button class="buy-btn" style="margin-top: 1rem;" onclick="closeModal('profileModal')">
                    Закрыть
                </button>
            `;
            
            document.getElementById('profileModal').classList.add('active');
        }

        // Авторизация
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const user = Storage.getUser(email, password);
            
            if (user) {
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('registerBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('sellBtn').style.display = 'block';
                document.getElementById('profileBtn').style.display = 'block';
                
                closeModal('loginModal');
                showToast('Добро пожаловать, ' + user.name);
                loadProducts();
            } else {
                showToast('Неверный email или пароль', 'error');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            
            const users = Storage.getUsers();
            if (users.find(u => u.email === email)) {
                showToast('Пользователь уже существует', 'error');
                return;
            }
            
            const newUser = {
                name,
                email,
                password
            };
            
            const user = Storage.addUser(newUser);
            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(user));
            
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('registerBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('sellBtn').style.display = 'block';
            document.getElementById('profileBtn').style.display = 'block';
            
            closeModal('registerModal');
            showToast('Регистрация успешна');
            loadProducts();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            
            document.getElementById('loginBtn').style.display = 'block';
            document.getElementById('registerBtn').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('sellBtn').style.display = 'none';
            document.getElementById('profileBtn').style.display = 'none';
            
            showToast('Вы вышли из системы');
            loadProducts();
        }

        // Проверка авторизации при загрузке
        (function checkAuth() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('registerBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('sellBtn').style.display = 'block';
                document.getElementById('profileBtn').style.display = 'block';
            }
        })();

        // Переключение табов
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tab === 'products') {
                document.getElementById('productsContainer').style.display = 'block';
                document.getElementById('chatsContainer').style.display = 'none';
                loadProducts();
            } else {
                document.getElementById('productsContainer').style.display = 'none';
                document.getElementById('chatsContainer').style.display = 'block';
                loadChats();
            }
        }

        function showMainPage() {
            switchTab('products');
        }

        // Модальные окна
        function showLoginModal() {
            document.getElementById('loginModal').classList.add('active');
        }

        function showRegisterModal() {
            document.getElementById('registerModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            if (paymentInterval) {
                clearInterval(paymentInterval);
                paymentInterval = null;
            }
        }

        // Закрытие по клику вне модалки
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
                if (paymentInterval) {
                    clearInterval(paymentInterval);
                    paymentInterval = null;
                }
            }
        }
    </script>
</body>
</html>
