<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход · Dev Monkey</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <a href="index.html">Dev Monkey</a>
            </div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Форум</a></li>
                    <li><a href="index.html?tab=repos">Репозитории</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <!-- Неавторизованное состояние (демо) -->
                <a href="login.html" class="btn btn-outline">Вход</a>
                <a href="register.html" class="btn btn-primary">Регистрация</a>
            </div>
        </div>
    </header>

    <main class="main-content container auth-page">
        <div class="auth-box">
            <h2>Вход в Dev Monkey</h2>
            <form class="auth-form">
                <div class="form-group">
                    <label for="username">Email или имя пользователя</label>
                    <input type="text" id="username" placeholder="example@mail.com или alice_dev">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="········">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Войти</button>
                <div class="auth-links">
                    <a href="#">Забыли пароль?</a> · <a href="register.html">Создать аккаунт</a>
                </div>
            </form>
            <div class="social-login">
                <p>Или войдите через:</p>
                <button class="btn btn-github"><i class="fab fa-github"></i> GitHub (демо)</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Dev Monkey. Сообщество разработчиков.</p>
        </div>
    </footer>
</body>
</html>
